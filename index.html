<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时文本聊天 - 优化版</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00ff88;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .user-setup {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .username-input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .username-input:focus {
            border-color: #4CAF50;
        }

        .online-users {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #eee;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message-bubble {
            max-width: 70%;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        .message-bubble.own {
            margin-left: auto;
        }

        .message-bubble.other {
            margin-right: auto;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #666;
        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .message-bubble.own .message-content {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .message-bubble.other .message-content {
            background: white;
            color: #333;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator {
            display: none;
            padding: 10px 20px;
            font-style: italic;
            color: #666;
            font-size: 0.9rem;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #666;
            margin: 0 1px;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            resize: none;
            min-height: 20px;
            max-height: 100px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #4CAF50;
        }

        .emoji-btn, .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .emoji-btn {
            background: #f0f0f0;
            color: #666;
        }

        .emoji-btn:hover {
            background: #e0e0e0;
        }

        .send-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .emoji-picker {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 15px;
            display: none;
            z-index: 1000;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
        }

        .emoji-item {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .emoji-item:hover {
            background: #f0f0f0;
        }

        .sidebar {
            width: 300px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            color: #333;
        }

        .users-list {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: #f0f0f0;
        }

        .user-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
        }

        .controls {
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .control-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .clear-btn {
            background: #ff4444;
            color: white;
        }

        .clear-btn:hover {
            background: #cc3333;
        }

        .sound-toggle {
            background: #f0f0f0;
            color: #333;
        }

        .sound-toggle:hover {
            background: #e0e0e0;
        }

        .sound-toggle.active {
            background: #4CAF50;
            color: white;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
                order: -1;
            }

            .user-setup {
                flex-direction: column;
                align-items: stretch;
            }

            .online-users {
                margin-left: 0;
                justify-content: center;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>
                <i class="fas fa-comments"></i>
                实时文本聊天
            </h1>
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">连接中...</span>
            </div>
        </div>

        <div class="user-setup">
            <div class="user-info">
                <div class="avatar" id="userAvatar">U</div>
                <input type="text" class="username-input" id="usernameInput" placeholder="输入您的用户名..." maxlength="20">
            </div>
            <div class="online-users">
                <i class="fas fa-users"></i>
                <span id="onlineCount">0</span> 在线用户
            </div>
        </div>

        <div class="main-content">
            <div class="chat-area">
                <div class="messages-container" id="messagesContainer">
                    <!-- 消息将在这里显示 -->
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <span id="typingUser">某人</span> 正在输入
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-container">
                        <button class="emoji-btn" id="emojiBtn">
                            <i class="fas fa-smile"></i>
                        </button>
                        <textarea class="message-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
                        <button class="send-btn" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-users"></i> 在线用户
                </div>
                <div class="users-list" id="usersList">
                    <!-- 用户列表将在这里显示 -->
                </div>
                <div class="controls">
                    <button class="control-btn sound-toggle active" id="soundToggle">
                        <i class="fas fa-volume-up"></i> 消息提示音
                    </button>
                    <button class="control-btn clear-btn" id="clearBtn">
                        <i class="fas fa-trash"></i> 清空聊天记录
                    </button>
                </div>
            </div>
        </div>

        <div class="emoji-picker" id="emojiPicker">
            <div class="emoji-grid" id="emojiGrid">
                <!-- 表情符号将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        const socket = io();
        let currentUser = {
            id: null,
            name: '匿名用户',
            avatar: 'U'
        };
        let onlineUsers = new Map();
        let soundEnabled = true;
        let typingTimeout = null;
        let isTyping = false;

        // DOM 元素
        const elements = {
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            usernameInput: document.getElementById('usernameInput'),
            userAvatar: document.getElementById('userAvatar'),
            onlineCount: document.getElementById('onlineCount'),
            messagesContainer: document.getElementById('messagesContainer'),
            typingIndicator: document.getElementById('typingIndicator'),
            typingUser: document.getElementById('typingUser'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            emojiBtn: document.getElementById('emojiBtn'),
            emojiPicker: document.getElementById('emojiPicker'),
            emojiGrid: document.getElementById('emojiGrid'),
            usersList: document.getElementById('usersList'),
            soundToggle: document.getElementById('soundToggle'),
            clearBtn: document.getElementById('clearBtn')
        };

        // 表情符号数据
        const emojis = ['😀', '😃', '😄', '😁', '😆', '😅', '😂', '🤣', '😊', '😇', '🙂', '🙃', '😉', '😌', '😍', '🥰', '😘', '😗', '😙', '😚', '😋', '😛', '😝', '😜', '🤪', '🤨', '🧐', '🤓', '😎', '🤩', '🥳', '😏', '😒', '😞', '😔', '😟', '😕', '🙁', '☹️', '😣', '😖', '😫', '😩', '🥺', '😢', '😭', '😤', '😠', '😡', '🤬', '🤯', '😳', '🥵', '🥶', '😱', '😨', '😰', '😥', '😓', '🤗', '🤔', '🤭', '🤫', '🤥', '😶', '😐', '😑', '😬', '🙄', '😯', '😦', '😧', '😮', '😲', '🥱', '😴', '🤤', '😪', '😵', '🤐', '🥴', '🤢', '🤮', '🤧', '😷', '🤒', '🤕', '🤑', '🤠', '😈', '👿', '👹', '👺', '🤡', '💩', '👻', '💀', '☠️', '👽', '👾', '🤖', '🎃', '😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾'];

        // 初始化
        function init() {
            setupEventListeners();
            generateEmojiPicker();
            loadUserSettings();
        }

        // 设置事件监听器
        function setupEventListeners() {
            // Socket 事件
            socket.on('connect', handleConnect);
            socket.on('disconnect', handleDisconnect);
            socket.on('messageHistory', handleMessageHistory);
            socket.on('newMessage', handleNewMessage);
            socket.on('userJoined', handleUserJoined);
            socket.on('userLeft', handleUserLeft);
            socket.on('userTyping', handleUserTyping);
            socket.on('userStoppedTyping', handleUserStoppedTyping);
            socket.on('usersUpdate', handleUsersUpdate);

            // UI 事件
            elements.usernameInput.addEventListener('input', handleUsernameChange);
            elements.messageInput.addEventListener('input', handleMessageInputChange);
            elements.messageInput.addEventListener('keypress', handleMessageKeyPress);
            elements.sendBtn.addEventListener('click', sendMessage);
            elements.emojiBtn.addEventListener('click', toggleEmojiPicker);
            elements.soundToggle.addEventListener('click', toggleSound);
            elements.clearBtn.addEventListener('click', clearMessages);

            // 点击外部关闭表情选择器
            document.addEventListener('click', (e) => {
                if (!elements.emojiPicker.contains(e.target) && !elements.emojiBtn.contains(e.target)) {
                    elements.emojiPicker.style.display = 'none';
                }
            });
        }

        // Socket 事件处理
        function handleConnect() {
            updateConnectionStatus(true);
            currentUser.id = socket.id;
            requestNotificationPermission();
        }

        function handleDisconnect() {
            updateConnectionStatus(false);
        }

        function handleMessageHistory(history) {
            elements.messagesContainer.innerHTML = '';
            history.forEach(message => {
                displayMessage(message, false);
            });
            scrollToBottom();
        }

        function handleNewMessage(data) {
            displayMessage(data.message, !data.fromSelf);
            if (!data.fromSelf) {
                showNotification(data.message);
                playNotificationSound();
            }
            scrollToBottom();
        }

        function handleUserJoined(user) {
            onlineUsers.set(user.id, user);
            updateUsersList();
            updateOnlineCount();
        }

        function handleUserLeft(userId) {
            onlineUsers.delete(userId);
            updateUsersList();
            updateOnlineCount();
        }

        function handleUserTyping(data) {
            if (data.userId !== currentUser.id) {
                elements.typingUser.textContent = data.username;
                elements.typingIndicator.style.display = 'block';
            }
        }

        function handleUserStoppedTyping(data) {
            if (data.userId !== currentUser.id) {
                elements.typingIndicator.style.display = 'none';
            }
        }

        function handleUsersUpdate(users) {
            onlineUsers.clear();
            users.forEach(user => onlineUsers.set(user.id, user));
            updateUsersList();
            updateOnlineCount();
        }

        // UI 事件处理
        function handleUsernameChange() {
            const username = elements.usernameInput.value.trim();
            if (username) {
                currentUser.name = username;
                currentUser.avatar = username.charAt(0).toUpperCase();
                elements.userAvatar.textContent = currentUser.avatar;
                socket.emit('updateUser', currentUser);
                saveUserSettings();
            }
        }

        function handleMessageInputChange() {
            const message = elements.messageInput.value.trim();
            elements.sendBtn.disabled = !message;

            // 自动调整文本框高度
            elements.messageInput.style.height = 'auto';
            elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 100) + 'px';

            // 打字指示器
            if (message && !isTyping) {
                isTyping = true;
                socket.emit('typing', { userId: currentUser.id, username: currentUser.name });
            }

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                if (isTyping) {
                    isTyping = false;
                    socket.emit('stopTyping', { userId: currentUser.id });
                }
            }, 1000);
        }

        function handleMessageKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // 核心功能
        function sendMessage() {
            const text = elements.messageInput.value.trim();
            if (!text) return;

            const message = {
                id: Date.now() + Math.random(),
                text: text,
                timestamp: new Date().toISOString(),
                user: { ...currentUser }
            };

            socket.emit('sendMessage', message);
            elements.messageInput.value = '';
            elements.messageInput.style.height = 'auto';
            elements.sendBtn.disabled = true;

            // 停止打字指示器
            if (isTyping) {
                isTyping = false;
                socket.emit('stopTyping', { userId: currentUser.id });
            }
        }

        function displayMessage(message, isOther = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-bubble ${isOther ? 'other' : 'own'}`;

            const timeStr = new Date(message.timestamp).toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });

            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="avatar" style="width: 20px; height: 20px; font-size: 0.7rem;">
                        ${message.user?.avatar || 'U'}
                    </div>
                    <span>${message.user?.name || '匿名用户'}</span>
                </div>
                <div class="message-content">
                    ${escapeHtml(message.text)}
                    <div class="message-time">${timeStr}</div>
                </div>
            `;

            elements.messagesContainer.appendChild(messageDiv);
        }

        function updateConnectionStatus(connected) {
            elements.statusDot.className = `status-dot ${connected ? 'connected' : ''}`;
            elements.statusText.textContent = connected ? '已连接' : '连接断开';
        }

        function updateUsersList() {
            elements.usersList.innerHTML = '';
            onlineUsers.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item';
                userDiv.innerHTML = `
                    <div class="avatar" style="width: 30px; height: 30px; font-size: 0.9rem;">
                        ${user.avatar}
                    </div>
                    <span>${user.name}</span>
                    <div class="user-status"></div>
                `;
                elements.usersList.appendChild(userDiv);
            });
        }

        function updateOnlineCount() {
            elements.onlineCount.textContent = onlineUsers.size;
        }

        function generateEmojiPicker() {
            elements.emojiGrid.innerHTML = '';
            emojis.forEach(emoji => {
                const emojiDiv = document.createElement('div');
                emojiDiv.className = 'emoji-item';
                emojiDiv.textContent = emoji;
                emojiDiv.addEventListener('click', () => {
                    elements.messageInput.value += emoji;
                    elements.emojiPicker.style.display = 'none';
                    elements.messageInput.focus();
                    handleMessageInputChange();
                });
                elements.emojiGrid.appendChild(emojiDiv);
            });
        }

        function toggleEmojiPicker() {
            const isVisible = elements.emojiPicker.style.display === 'block';
            elements.emojiPicker.style.display = isVisible ? 'none' : 'block';
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            elements.soundToggle.className = `control-btn sound-toggle ${soundEnabled ? 'active' : ''}`;
            elements.soundToggle.innerHTML = `
                <i class="fas fa-volume-${soundEnabled ? 'up' : 'mute'}"></i> 
                消息提示音
            `;
            saveUserSettings();
        }

        function clearMessages() {
            if (confirm('确定要清空所有聊天记录吗？')) {
                socket.emit('clearMessages');
            }
        }

        function scrollToBottom() {
            elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
        }

        // 通知功能
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function showNotification(message) {
            if ('Notification' in window && Notification.permission === 'granted') {
                const notification = new Notification('新消息', {
                    body: `${message.user?.name || '匿名用户'}: ${message.text}`,

        function playNotificationSound() {
            if (soundEnabled) {
                // 创建简单的提示音
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            }
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function saveUserSettings() {
            localStorage.setItem('chatUserSettings', JSON.stringify({
                name: currentUser.name,
                soundEnabled: soundEnabled
            }));
        }

        function loadUserSettings() {
            const settings = localStorage.getItem('chatUserSettings');
            if (settings) {
                const parsed = JSON.parse(settings);
                if (parsed.name) {
                    elements.usernameInput.value = parsed.name;
                    handleUsernameChange();
                }
                if (parsed.soundEnabled !== undefined) {
                    soundEnabled = parsed.soundEnabled;
                    if (!soundEnabled) {
                        toggleSound();
                    }
                }
            }
        }

        // 启动应用
        init();
    </script>
