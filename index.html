<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时文本聊天 - 优化版</title>
    <script src="/socket.io/socket.io.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .chat-container {
        width: 100%;
        max-width: 1200px;
        height: 90vh;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #4caf50, #45a049);
        color: white;
        padding: 20px;
        text-align: center;
        position: relative;
      }

      .header h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .connection-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.9rem;
        opacity: 0.9;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4444;
        animation: pulse 2s infinite;
      }

      .status-dot.connected {
        background: #00ff88;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .user-setup {
        background: white;
        padding: 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
      }

      .username-input {
        padding: 8px 12px;
        border: 2px solid #ddd;
        border-radius: 20px;
        outline: none;
        transition: border-color 0.3s;
      }

      .username-input:focus {
        border-color: #4caf50;
      }

      .online-users {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        color: #666;
      }

      .main-content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #eee;
      }

      .messages-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8f9fa;
      }

      .message-bubble {
        max-width: 70%;
        margin-bottom: 15px;
        animation: slideIn 0.3s ease-out;
      }

      .message-bubble.own {
        margin-left: auto;
      }

      .message-bubble.other {
        margin-right: auto;
      }

      .message-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
        font-size: 0.8rem;
        color: #666;
      }

      .message-content {
        background: white;
        padding: 12px 16px;
        border-radius: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        position: relative;
      }

      .message-bubble.own .message-content {
        background: linear-gradient(135deg, #4caf50, #45a049);
        color: white;
      }

      .message-bubble.other .message-content {
        background: white;
        color: #333;
      }

      .message-time {
        font-size: 0.7rem;
        opacity: 0.7;
        margin-top: 5px;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .typing-indicator {
        display: none;
        padding: 10px 20px;
        font-style: italic;
        color: #666;
        font-size: 0.85rem;
      }

      .typing-dots {
        display: inline-block;
      }

      .typing-dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #666;
        margin: 0 1px;
        animation: typing 1.4s infinite;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }

      .input-area {
        padding: 15px;
        background: white;
        border-top: 1px solid #eee;
      }

      .input-container {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .message-input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #ddd;
        border-radius: 25px;
        outline: none;
        resize: none;
        min-height: 20px;
        max-height: 100px;
        font-family: inherit;
        transition: border-color 0.3s;
        font-size: 16px; /* 防止iOS缩放 */
      }

      .message-input:focus {
        border-color: #4caf50;
      }

      .emoji-btn,
      .send-btn {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        font-size: 18px;
        flex-shrink: 0;
      }

      .emoji-btn {
        background: #f0f0f0;
        color: #666;
      }

      .emoji-btn:active {
        background: #e0e0e0;
        transform: scale(0.95);
      }

      .send-btn {
        background: linear-gradient(135deg, #4caf50, #45a049);
        color: white;
      }

      .send-btn:active {
        transform: scale(0.95);
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .mobile-nav-btn {
        display: none; /* 默认隐藏，只在移动端显示 */
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 18px;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        position: relative;
        overflow: hidden;
      }

      .mobile-nav-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .mobile-nav-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
      }

      .mobile-nav-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .mobile-nav-btn:active::before {
        left: 100%;
      }

      .emoji-picker {
        position: absolute;
        bottom: 70px;
        right: 15px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        padding: 15px;
        display: none;
        z-index: 1000;
        max-height: 200px;
        overflow-y: auto;
      }

      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }

      .emoji-item {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 8px;
        transition: background 0.2s;
        font-size: 20px;
      }

      .emoji-item:active {
        background: #f0f0f0;
        transform: scale(0.9);
      }

      .sidebar {
        width: 300px;
        background: white;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 98;
      }

      .sidebar-header {
        padding: 15px 20px;
        border-bottom: 1px solid #eee;
        font-weight: bold;
        color: #333;
        font-size: 0.95rem;
      }

      .users-list {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .user-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 5px;
        transition: background 0.2s;
        min-height: 48px; /* 增加触摸目标 */
      }

      .user-item:active {
        background: #f0f0f0;
      }

      .user-status {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff88;
        flex-shrink: 0;
      }

      .controls {
        padding: 15px;
        border-top: 1px solid #eee;
      }

      .control-btn {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.9rem;
        min-height: 48px; /* 增加触摸目标 */
      }

      .control-btn:active {
        transform: scale(0.98);
      }

      .clear-btn {
        background: #ff4444;
        color: white;
      }

      .clear-btn:active {
        background: #cc3333;
      }

      .sound-toggle {
        background: #f0f0f0;
        color: #333;
      }

      .sound-toggle:active {
        background: #e0e0e0;
      }

      .sound-toggle.active {
        background: #4caf50;
        color: white;
      }

      /* 移动端遮罩层 */
      .mobile-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 97;
      }

      /* 响应式设计 */
      @media (max-width: 768px) {
        body {
          padding: 0;
          overflow: hidden;
        }

        .chat-container {
          height: 100vh;
          border-radius: 0;
          max-width: none;
        }

        .header {
          padding: 12px 20px;
        }

        .header h1 {
          font-size: 1.3rem;
          margin-bottom: 6px;
        }

        .mobile-nav-btn {
          display: flex;
        }

        .user-setup {
          padding: 12px 15px;
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }

        .user-info {
          min-width: auto;
        }

        .online-users {
          justify-content: center;
          margin-left: 0;
        }

        .main-content {
          flex-direction: row;
        }

        .sidebar {
          position: fixed;
          top: 0;
          right: -300px;
          height: 100vh;
          width: 280px;
          z-index: 98;
          transition: right 0.3s ease;
          box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
        }

        .sidebar.open {
          right: 0;
        }

        .mobile-overlay.show {
          display: block;
        }

        .chat-area {
          border-right: none;
        }

        .messages-container {
          padding: 12px;
        }

        .message-bubble {
          max-width: 90%;
        }

        .input-area {
          padding: 12px;
          /* 为iOS虚拟键盘留出空间 */
          padding-bottom: env(safe-area-inset-bottom, 12px);
        }

        .emoji-picker {
          right: 12px;
          left: 12px;
          width: auto;
          max-height: 180px;
        }

        .emoji-grid {
          grid-template-columns: repeat(8, 1fr);
          gap: 6px;
        }

        .emoji-item {
          width: 32px;
          height: 32px;
          font-size: 18px;
        }

        /* 优化小屏幕字体 */
        .message-content {
          font-size: 15px;
          padding: 10px 14px;
        }

        .message-header {
          font-size: 0.7rem;
        }

        .message-time {
          font-size: 0.65rem;
        }

        .typing-indicator {
          font-size: 0.8rem;
          padding: 6px 12px;
        }
      }

      @media (max-width: 480px) {
        .header h1 {
          font-size: 1.2rem;
        }

        .username-input {
          font-size: 16px; /* 防止iOS缩放 */
        }

        .message-input {
          font-size: 16px; /* 防止iOS缩放 */
          padding: 10px 14px;
        }

        .emoji-btn,
        .send-btn {
          width: 44px;
          height: 44px;
          font-size: 16px;
        }

        .input-container {
          gap: 8px;
        }

        .sidebar {
          width: 260px;
          right: -260px;
        }

        .emoji-grid {
          grid-template-columns: repeat(7, 1fr);
        }
      }

      /* 横屏适配 */
      @media (max-width: 768px) and (orientation: landscape) {
        .header {
          padding: 8px 20px;
        }

        .header h1 {
          font-size: 1.1rem;
          margin-bottom: 4px;
        }

        .user-setup {
          padding: 8px 15px;
        }

        .input-area {
          padding: 10px 12px;
        }
      }

      /* 滚动条样式 */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 2px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1a1;
      }

      /* 移动端滚动条隐藏 */
      @media (max-width: 768px) {
        ::-webkit-scrollbar {
          width: 0;
          background: transparent;
        }
      }

      /* 安全区域适配 */
      @supports (padding: max(0px)) {
        .chat-container {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
        }

        .input-area {
          padding-bottom: max(15px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="header">
        <h1>
          <i class="fas fa-comments"></i>
          实时文本聊天
        </h1>
        <div class="connection-status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">连接中...</span>
        </div>
        <button class="mobile-nav-btn" id="mobileNavBtn">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <div class="user-setup">
        <div class="user-info">
          <div class="avatar" id="userAvatar">U</div>
          <input
            type="text"
            class="username-input"
            id="usernameInput"
            placeholder="输入您的用户名..."
            maxlength="20"
          />
        </div>
        <div class="online-users">
          <i class="fas fa-users"></i>
          <span id="onlineCount">0</span> 在线用户
        </div>
      </div>

      <div class="main-content">
        <div class="chat-area">
          <div class="messages-container" id="messagesContainer">
            <!-- 消息将在这里显示 -->
          </div>
          <div class="typing-indicator" id="typingIndicator">
            <span id="typingUser">某人</span> 正在输入
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="input-area">
            <div class="input-container">
              <button class="emoji-btn" id="emojiBtn">
                <i class="fas fa-smile"></i>
              </button>
              <textarea
                class="message-input"
                id="messageInput"
                placeholder="输入消息..."
                rows="1"
              ></textarea>
              <button class="send-btn" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <i class="fas fa-users"></i> 在线用户
          </div>
          <div class="users-list" id="usersList">
            <!-- 用户列表将在这里显示 -->
          </div>
          <div class="controls">
            <button class="control-btn sound-toggle active" id="soundToggle">
              <i class="fas fa-volume-up"></i> 消息提示音
            </button>
            <button class="control-btn clear-btn" id="clearBtn">
              <i class="fas fa-trash"></i> 清空聊天记录
            </button>
          </div>
        </div>
      </div>

      <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid">
          <!-- 表情符号将在这里显示 -->
        </div>
      </div>

      <!-- 移动端遮罩层 -->
      <div class="mobile-overlay" id="mobileOverlay"></div>
    </div>

      // 移动端检测
      function isMobile() {
        return window.innerWidth <= 768;
      }

      // 初始化
      function init() {
        setupEventListeners();
        generateEmojiPicker();
        loadUserSettings();
        setupMobileNavigation();
        handleResize();
      }

      // 设置移动端导航
      function setupMobileNavigation() {
        elements.mobileNavBtn.addEventListener("click", toggleSidebar);
        elements.mobileOverlay.addEventListener("click", closeSidebar);

        // 监听窗口大小变化
        window.addEventListener("resize", handleResize);
      }

      // 切换侧边栏
      function toggleSidebar() {
        if (isMobile()) {
          elements.sidebar.classList.toggle("open");
          elements.mobileOverlay.classList.toggle("show");
        }
      }

      // 关闭侧边栏
      function closeSidebar() {
        elements.sidebar.classList.remove("open");
        elements.mobileOverlay.classList.remove("show");
      }

      // 处理窗口大小变化
      function handleResize() {
        if (!isMobile()) {
          closeSidebar();
        }
      }

      // 设置事件监听器
      function setupEventListeners() {
        // Socket 事件
        socket.on("connect", handleConnect);
        socket.on("disconnect", handleDisconnect);
        socket.on("messageHistory", handleMessageHistory);
        socket.on("newMessage", handleNewMessage);
        socket.on("userJoined", handleUserJoined);
        socket.on("userLeft", handleUserLeft);
        socket.on("userTyping", handleUserTyping);
        socket.on("userStoppedTyping", handleUserStoppedTyping);
        socket.on("usersUpdate", handleUsersUpdate);

        // UI 事件
        elements.usernameInput.addEventListener("input", handleUsernameChange);
        elements.messageInput.addEventListener(
          "input",
          handleMessageInputChange
        );
        elements.messageInput.addEventListener(
          "keypress",
          handleMessageKeyPress
        );
        elements.sendBtn.addEventListener("click", sendMessage);
        elements.emojiBtn.addEventListener("click", toggleEmojiPicker);
        elements.soundToggle.addEventListener("click", toggleSound);
        elements.clearBtn.addEventListener("click", clearMessages);

        // 移动端优化：防止双击缩放
        elements.sendBtn.addEventListener("touchstart", function (e) {
          e.preventDefault();
        });

        elements.emojiBtn.addEventListener("touchstart", function (e) {
          e.preventDefault();
        });

        // 点击外部关闭表情选择器
        document.addEventListener("click", e => {
          if (
            !elements.emojiPicker.contains(e.target) &&
            !elements.emojiBtn.contains(e.target)
          ) {
            elements.emojiPicker.style.display = "none";
          }
        });

        // 移动端输入框焦点处理
        if (isMobile()) {
          elements.messageInput.addEventListener("focus", function () {
            setTimeout(() => {
              this.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 300);
          });
        }
      }

      // Socket 事件处理
      function handleConnect() {
        updateConnectionStatus(true);
        currentUser.id = socket.id;
        requestNotificationPermission();
      }

      function handleDisconnect() {
        updateConnectionStatus(false);
      }

      function handleMessageHistory(history) {
        elements.messagesContainer.innerHTML = "";
        history.forEach(message => {
          displayMessage(message, false);
        });
        scrollToBottom();
      }

      function handleNewMessage(data) {
        displayMessage(data.message, !data.fromSelf);
        if (!data.fromSelf) {
          showNotification(data.message);
          playNotificationSound();
        }
        scrollToBottom();
      }

      function handleUserJoined(user) {
        onlineUsers.set(user.id, user);
        updateUsersList();
        updateOnlineCount();
      }

      function handleUserLeft(userId) {
        onlineUsers.delete(userId);
        updateUsersList();
        updateOnlineCount();
      }

      function handleUserTyping(data) {
        if (data.userId !== currentUser.id) {
          elements.typingUser.textContent = data.username;
          elements.typingIndicator.style.display = "block";
        }
      }

      function handleUserStoppedTyping(data) {
        if (data.userId !== currentUser.id) {
          elements.typingIndicator.style.display = "none";
        }
      }

      function handleUsersUpdate(users) {
        onlineUsers.clear();
        users.forEach(user => onlineUsers.set(user.id, user));
        updateUsersList();
        updateOnlineCount();
      }

      // UI 事件处理
      function handleUsernameChange() {
        const username = elements.usernameInput.value.trim();
        if (username) {
          currentUser.name = username;
          currentUser.avatar = username.charAt(0).toUpperCase();
          elements.userAvatar.textContent = currentUser.avatar;
          socket.emit("updateUser", currentUser);
          saveUserSettings();
        }
      }

      function handleMessageInputChange() {
        const message = elements.messageInput.value.trim();
        elements.sendBtn.disabled = !message;

        // 自动调整文本框高度
        elements.messageInput.style.height = "auto";
        elements.messageInput.style.height =
          Math.min(elements.messageInput.scrollHeight, 100) + "px";

        // 打字指示器
        if (message && !isTyping) {
          isTyping = true;
          socket.emit("typing", {
            userId: currentUser.id,
            username: currentUser.name,
          });
        }

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          if (isTyping) {
            isTyping = false;
            socket.emit("stopTyping", { userId: currentUser.id });
          }
        }, 1000);
      }

      function handleMessageKeyPress(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      // 发送消息
      function sendMessage() {
        const message = elements.messageInput.value.trim();
        if (message) {
          const messageData = {
            id: Date.now(),
            text: message,
            username: currentUser.name,
            avatar: currentUser.avatar,
            timestamp: new Date().toISOString(),
            userId: currentUser.id,
          };

          socket.emit("sendMessage", messageData);
          elements.messageInput.value = "";
          elements.messageInput.style.height = "auto";
          elements.sendBtn.disabled = true;

          // 停止打字指示器
          if (isTyping) {
            isTyping = false;
            socket.emit("stopTyping", { userId: currentUser.id });
          }

          // 移动端关闭表情选择器
          if (isMobile()) {
            elements.emojiPicker.style.display = "none";
          }
        }
      }

      // 显示消息
      function displayMessage(message, playSound = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message-bubble ${
          message.userId === currentUser.id ? "own" : "other"
        }`;

        const time = new Date(message.timestamp).toLocaleTimeString("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
        });

        messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-avatar">${message.avatar}</span>
                    <span class="message-username">${message.username}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">${escapeHtml(message.text)}</div>
            `;

        elements.messagesContainer.appendChild(messageDiv);
        scrollToBottom();
      }

      // 更新连接状态
      function updateConnectionStatus(connected) {
        elements.statusDot.classList.toggle("connected", connected);
        elements.statusText.textContent = connected ? "已连接" : "连接中...";
      }

      // 更新在线用户数
      function updateOnlineCount() {
        elements.onlineCount.textContent = onlineUsers.size;
      }

      // 更新用户列表
      function updateUsersList() {
        elements.usersList.innerHTML = "";
        onlineUsers.forEach(user => {
          const userDiv = document.createElement("div");
          userDiv.className = "user-item";
          userDiv.innerHTML = `
                    <div class="user-status"></div>
                    <div class="avatar" style="width: 32px; height: 32px; font-size: 1rem;">${user.avatar}</div>
                    <span>${user.name}</span>
                `;
          elements.usersList.appendChild(userDiv);
        });
      }

      // 生成表情选择器
      function generateEmojiPicker() {
        elements.emojiGrid.innerHTML = "";
        emojis.forEach(emoji => {
          const emojiDiv = document.createElement("div");
          emojiDiv.className = "emoji-item";
          emojiDiv.textContent = emoji;
          emojiDiv.addEventListener("click", () => {
            elements.messageInput.value += emoji;
            elements.messageInput.focus();
            elements.emojiPicker.style.display = "none";
            handleMessageInputChange();
          });
          elements.emojiGrid.appendChild(emojiDiv);
        });
      }

      // 切换表情选择器
      function toggleEmojiPicker(e) {
        e.stopPropagation();
        const isVisible = elements.emojiPicker.style.display === "block";
        elements.emojiPicker.style.display = isVisible ? "none" : "block";
      }

      // 切换声音
      function toggleSound() {
        soundEnabled = !soundEnabled;
        elements.soundToggle.classList.toggle("active", soundEnabled);
        const icon = elements.soundToggle.querySelector("i");
        icon.className = soundEnabled
          ? "fas fa-volume-up"
          : "fas fa-volume-mute";
        saveUserSettings();
      }

      // 清空消息
      function clearMessages() {
        if (confirm("确定要清空所有聊天记录吗？")) {
          elements.messagesContainer.innerHTML = "";
        }
      }

      // 滚动到底部
      function scrollToBottom() {
        setTimeout(() => {
          elements.messagesContainer.scrollTop =
            elements.messagesContainer.scrollHeight;
        }, 100);
      }

      // 播放通知声音
      function playNotificationSound() {
        if (soundEnabled) {
          try {
            const audio = new Audio(
              "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT"
            );
            audio.volume = 0.3;
            audio.play().catch(() => {});
          } catch (e) {}
        }
      }

      // 请求通知权限
      function requestNotificationPermission() {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }

      // 显示通知
      function showNotification(message) {
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification(`${message.username} 发来消息`, {
              body: message.text,
              icon: "/favicon.ico",
              tag: "chat-message",
            });
          } catch (e) {}
        }
      }

      // 保存用户设置
      function saveUserSettings() {
        try {
          localStorage.setItem(
            "chatSettings",
            JSON.stringify({
              username: currentUser.name,
              soundEnabled: soundEnabled,
            })
          );
        } catch (e) {}
      }

      // 加载用户设置
      function loadUserSettings() {
        try {
          const settings = JSON.parse(
            localStorage.getItem("chatSettings") || "{}"
          );
          if (settings.username) {
            elements.usernameInput.value = settings.username;
            handleUsernameChange();
          }
          if (typeof settings.soundEnabled === "boolean") {
            soundEnabled = settings.soundEnabled;
            elements.soundToggle.classList.toggle("active", soundEnabled);
            const icon = elements.soundToggle.querySelector("i");
            icon.className = soundEnabled
              ? "fas fa-volume-up"
              : "fas fa-volume-mute";
          }
        } catch (e) {}
      }

      // HTML转义
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", init);

      // 防止移动端双击缩放
      let lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (event) {
          const now = new Date().getTime();
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        },
        false
      );

      // 防止移动端拖拽
      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.target.tagName !== "TEXTAREA" && e.target.tagName !== "INPUT") {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    </script>
  </body>
</html>
