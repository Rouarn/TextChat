<!doctype html>
<!--
  实时文本聊天系统 - 前端页面（v4 模块化重构）

  结构：
  - head：资源预连接、字体与图标、核心样式、favicon
  - body：应用卡片（顶栏 / 身份栏 / 聊天区 + 侧栏 / 表情选择器 / 遮罩）

  本文件只负责"布局骨架"：所有结构性元素及类名固定，
  动态内容由 js/components 下的组件渲染，避免 HTML/JS 重复描述结构。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>实时文本聊天</title>

    <!-- 资源预连接：缩短字体/图标首次加载时间 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="/css/style.css?v=4" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>"
    />
  </head>
  <body>
    <div class="chat-container">
      <!-- 顶栏：应用标识 + 连接状态（内容由 TopBar 组件渲染） -->
      <header class="header" id="topBar"></header>

      <!-- 身份栏：头像 / 昵称编辑 / 在线人数 / 侧栏开关（IdentityBar 组件） -->
      <section class="user-setup" id="identityBar"></section>

      <!-- 主体：聊天区 + 侧栏 -->
      <div class="main-content">
        <div class="chat-area">
          <!-- 断线重连横幅（默认隐藏） -->
          <div class="connection-banner" id="connectionBanner">
            <i class="fas fa-circle-notch fa-spin"></i>
            <span id="connectionBannerText"></span>
          </div>

          <!-- 消息滚动区：骨架屏 / 日期分隔 / 消息气泡 / 空状态（MessageList 组件） -->
          <div class="messages-container" id="messagesContainer"></div>

          <!-- 打字指示器（TypingIndicator 组件） -->
          <div class="typing-indicator" id="typingIndicator">
            <span id="typingUser"></span>
            <span class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </div>

          <!-- 输入区（Composer 组件渲染内部控件） -->
          <div class="input-area" id="inputArea">
            <div class="input-container" id="inputContainer"></div>
          </div>

          <!-- 回到底部按钮（默认隐藏，未贴底且有新消息时出现） -->
          <button class="jump-latest" id="jumpLatest" aria-label="查看最新消息">
            <i class="fas fa-arrow-down"></i>
            <span class="jump-badge" id="jumpBadge"></span>
          </button>
        </div>

        <!-- 侧栏：在线用户 + 功能开关（Sidebar 组件；平板/手机为抽屉） -->
        <aside class="sidebar" id="sidebar"></aside>
      </div>

      <!-- 表情选择器（EmojiPicker 组件；事件委托） -->
      <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <!-- 移动端/平板遮罩：与侧栏联动 -->
      <div class="mobile-overlay" id="mobileOverlay"></div>
    </div>

    <!-- 唯一入口模块（socket.io-client 已随 vendor bundle 提供） -->
    <script type="module" src="/js/app.js?v=4"></script>
  </body>
</html>
